# 工作流名称：用于在 GitHub Actions 界面显示
name: 编译immortalwrt的源

# 定义触发条件
on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: false
        default: 'false'

# 全局环境变量配置
env:
  URL: https://github.com/immortalwrt/immortalwrt
  BRANCH: v24.10.5
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: imm_n60pro.config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  
  # 上传控制开关
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  UPLOAD_GOFILE: false  # 添加定义
  
  # 设备信息
  DEVICE_NAME: n60pro  # 添加定义
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write  # 用于创建/删除release、推送标签
      actions: write   # 用于删除工作流运行记录
      
    steps:
    # 第一步：检出当前仓库代码到工作目录
    - name: Checkout
      uses: actions/checkout@v4

    # 第二步：服务器硬件资源检查
    - name: 检查服务器配置
      run: |
        echo "::group::🖥️ 服务器资源详情"
        echo "⚠️ 重要提示：性能不足请取消运行！"
        echo "--------------------------CPU信息--------------------------"
        echo "物理CPU数量:$(grep "physical id" /proc/cpuinfo | sort | uniq | wc -l)"
        echo "CPU型号: $(lscpu | grep 'Model name' | cut -d: -f2 | xargs)"
        echo "逻辑核心数: $(nproc)"
        echo "--------------------------内存信息--------------------------"
        echo "总内存: $(free -h | awk '/Mem/{print $2}')"
        sudo lshw -short -C memory | grep GiB || true
        echo "--------------------------硬盘信息--------------------------"
        df -Th
        echo "::endgroup::"
        
    # 第三步：准备编译环境
    - name: 初始化构建环境
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        # 定义需要清理的目录列表，避免重复
        CLEAN_DIRS=(
          "/etc/apt/sources.list.d/*"
          "/usr/share/dotnet"
          "/usr/local/lib/android"
          "/opt/ghc"
          "/opt/hostedtoolcache/CodeQL"
          "/usr/local/.ghcup"
          "/usr/share/swift"
          "/usr/lib/jvm"
          "/opt/hostedtoolcache"
          "/usr/local/share/powershell"
          "/usr/share/miniconda"
          "/usr/local/share/chromium"
          "/opt/google/chrome"
          "/opt/microsoft/msedge"
        )
        
        # 清理系统冗余文件
        for dir in "${CLEAN_DIRS[@]}"; do
          sudo rm -rf "$dir" 2>/dev/null || true
        done
        
        echo "=== Disk usage after cleanup ==="
        df -h /
        
        # 清理Docker缓存释放空间
        sudo docker system prune -a -f 2>/dev/null || true
        
        # 更新软件源并安装编译依赖
        sudo apt update -y
        sudo apt full-upgrade -y
        sudo apt install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
          bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib \
          g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev \
          libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev \
          libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp nano \
          ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils \
          python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs \
          upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstdrsion swig texinfo uglifyjs upx-ucl unzip \
                  vim wget xmlto xxd zlib1g-dev
        
        # 配置系统时区
        sudo timedatectl set-timezone "$TZ"
        
        # 创建持久化工作目录并授权
        sudo mkdir -p /workdir
        sudo chown -R $USER:$GROUPS /workdir
        
    # 第四步：获取源码
    - name: 克隆源代码
      working-directory: /workdir
      run: |
        # 检查关键环境变量是否为空
        if [ -z "$BRANCH" ] || [ -z "$URL" ]; then
          echo "❌ 错误：BRANCH或URL环境变量为空"
          exit 1
        fi
        
        echo "::group::📦 存储空间信息"
        df -hT $PWD
        echo "::endgroup::"
        
        # 克隆源码，确保目录存在
        git clone -b $BRANCH --single-branch --filter=blob:none $URL immortalwrt || {
          echo "❌ 源码克隆失败"
          exit 1
        }
        
        # 确保目标目录存在后创建软链接
        mkdir -p $GITHUB_WORKSPACE/immortalwrt
        ln -sf /workdir/immortalwrt/* $GITHUB_WORKSPACE/immortalwrt/
        
    # 第五步：应用第一阶段自定义配置
    - name: 加载自定义配置diy-part1.sh
      run: |
        echo "::group::🚀 执行自定义脚本diy-part1.sh"
        cd $GITHUB_WORKSPACE/immortalwrt
        
        # 移动feeds配置文件（如果存在）
        [ -e $GITHUB_WORKSPACE/$FEEDS_CONF ] && mv $GITHUB_WORKSPACE/$FEEDS_CONF ./feeds.conf.default
        
        # 执行自定义脚本（如果存在）
        if [ -e $GITHUB_WORKSPACE/$DIY_P1_SH ]; then
          chmod +x $GITHUB_WORKSPACE/$DIY_P1_SH
          $GITHUB_WORKSPACE/$DIY_P1_SH || {
            echo "⚠️ diy-part1.sh执行出错，但继续流程"
          }
        else
          echo "ℹ️ 未找到diy-part1.sh脚本，跳过执行"
        fi
        echo "::endgroup::"

    # 第六步：更新软件源
    - name: 更新 feeds
      run: |
        cd $GITHUB_WORKSPACE/immortalwrt
        echo "::group::🔄 更新软件源"
        ./scripts/feeds update -a || {
          echo "❌ Feeds更新失败，重试一次"
          ./scripts/feeds update -a || exit 1
        }
        echo "::endgroup::"

    # 第七步：安装软件包
    - name: 安装 feeds
      run: |
        cd $GITHUB_WORKSPACE/immortalwrt
        echo "::group::📥 安装软件包"
        ./scripts/feeds install -a || {
          echo "❌ Feeds安装失败，重试一次"
          ./scripts/feeds install -a || exit 1
        }
        echo "::endgroup::"

    # 第八步：应用第二阶段自定义配置
    - name: 加载自定义配置diy-part2.sh
      run: |
        echo "::group::🚀 执行自定义脚本diy-part2.sh"
        cd $GITHUB_WORKSPACE/immortalwrt
        
        # 移动files目录（如果存在）
        [ -d $GITHUB_WORKSPACE/files ] && mv $GITHUB_WORKSPACE/files ./
        
        # 移动配置文件（如果存在）
        [ -e $GITHUB_WORKSPACE/$CONFIG_FILE ] && mv $GITHUB_WORKSPACE/$CONFIG_FILE ./.config
        
        # 执行自定义脚本（如果存在）
        if [ -e $GITHUB_WORKSPACE/$DIY_P2_SH ]; then
          chmod +x $GITHUB_WORKSPACE/$DIY_P2_SH
          $GITHUB_WORKSPACE/$DIY_P2_SH || {
            echo "⚠️ diy-part2.sh执行出错，但继续流程"
          }
        else
          echo "ℹ️ 未找到diy-part2.sh脚本，跳过执行"
        fi
        echo "::endgroup::"
        
    # 第九步：下载依赖包
    - name: 下载依赖
      id: package
      run: |
        cd $GITHUB_WORKSPACE/immortalwrt
        make defconfig
        
        echo "::group::📦 下载软件包"
        # 尝试多线程下载，失败则单线程详细输出
        make download -j$(($(nproc) + 1)) || {
          echo "⚠️ 多线程下载失败，单线程重试"
          make download -j1 V=s || exit 1
        }
        echo "::endgroup::"
        
        echo "::group::🔍 检查无效文件"
        # 删除小于1KB的无效文件
        find dl -size -1024c -exec ls -l {} \; 2>/dev/null
        find dl -size -1024c -exec rm -f {} \; 2>/dev/null
        echo "::endgroup::"

    # 第十步：开始编译固件
    - name: 编译固件
      id: compile
      run: |
        echo "::group::🏗️ 编译日志"
        cd $GITHUB_WORKSPACE/immortalwrt
        
        # 编译固件，失败则单线程调试模式
        make -j$(($(nproc) + 1)) || {
          echo "⚠️ 多线程编译失败，单线程重试（调试模式）"
          make -j1 V=s || {
            echo "❌ 编译最终失败"
            echo "status=failed" >> $GITHUB_OUTPUT
            exit 1
          }
        }
        
        echo "status=success" >> $GITHUB_OUTPUT
        echo "::endgroup::"

    # 第十一步：收集存储空间信息
    - name: 收集编译结果
      if: ${{ cancelled() == false }}
      run: |
        echo "::group::📊 最终存储空间使用"
        df -hT
        echo "::endgroup::"
        
    # 第十二步：整理固件文件
    - name: 整理输出文件
      id: organize
      if: ${{ env.UPLOAD_FIRMWARE == 'true' && cancelled() == false && steps.compile.outputs.status == 'success' }}
      run: |
        # 生成文件日期标签
        echo "FILE_DATE=$(date +'%Y%m%d')" >> $GITHUB_ENV
        
        # 定位固件目录
        FIRMWARE_DIR=$(find $GITHUB_WORKSPACE/immortalwrt/bin/targets -type d -mindepth 2 -maxdepth 2 | head -n1)
        if [ -z "$FIRMWARE_DIR" ]; then
          echo "❌ 未找到固件输出目录"
          exit 1
        fi
        
        cd $FIRMWARE_DIR
        rm -rf packages 2>/dev/null || true
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    # 第十三步：上传固件文件
    - name: 上传输出文件
      uses: actions/upload-artifact@v4
      if: ${{ steps.organize.outputs.status == 'success' && cancelled() == false }}
      with:
        name: immortalwrt_firmware_${{ env.DEVICE_NAME }}_${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    # 第十四步：生成发布日期标签
    - name: 生成发布标签
      id: tag
      if: ${{ env.UPLOAD_RELEASE == 'true' && cancelled() == false && steps.compile.outputs.status == 'success' }}
      run: |
        # 检查设备名称是否为空
        if [ -z "$DEVICE_NAME" ]; then
          echo "❌ DEVICE_NAME环境变量为空"
          exit 1
        fi
        
        RELEASE_TAG=$(date +"%Y.%m.%d-%H%M")
        echo "release_tag=$RELEASE_TAG" >> $GITHUB_OUTPUT
        
        # 生成发布说明
        cat > release.txt << EOF
# ImmortalWrt 固件发布 $RELEASE_TAG

## 设备: $DEVICE_NAME
## 分支: $BRANCH
## 编译时间: $(date +'%Y-%m-%d %H:%M:%S %Z')
EOF
        echo "status=success" >> $GITHUB_OUTPUT

    # 第十五步：发布到GitHub Release
    - name: 发布固件至 Release
      uses: softprops/action-gh-release@v2
      if: ${{ steps.tag.outputs.status == 'success' && cancelled() == false }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        name: ImmortalWrt ${{ env.DEVICE_NAME }} ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: ${{ env.FIRMWARE }}/*
        draft: false
        prerelease: false

    # 第十六步：清理旧工作流运行（延迟执行，避免冲突）
    - name: 删除工作流运行
      if: ${{ cancelled() == false }}
      uses: Mattraks/delete-workflow-runs@v2
      with:
        retain_days: 0
        keep_minimum_runs: 2
        exclude_current_runs: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}       

    # 第十七步：清理旧版本发布（增加延迟，确保新版本发布完成）
    - name: 删除旧版本
      uses: dev-drprasad/delete-older-releases@v0.3.4
      if: ${{ env.UPLOAD_RELEASE == 'true' && cancelled() == false && steps.tag.outputs.status == 'success' }}
      with:
        keep_latest: 5
        delete_tags: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
